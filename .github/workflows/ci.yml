name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :storyly-sdk:testReleaseUnitTest

      # Proves the published library still compiles standalone, and that the
      # sample app builds without local.properties (as a fresh clone would).
      - name: Build library
        run: ./gradlew :storyly-sdk:assembleRelease

      - name: Build sample app
        run: ./gradlew :app:assembleDebug

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: storyly-sdk/build/reports/tests/
